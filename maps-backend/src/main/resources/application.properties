spring.config.import=optional:file:.env[.properties]
spring.application.name=maps-backend

# Database
spring.datasource.url=${APP_DB_URL}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=${APP_DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.database-platform=${APP_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${APP_JPA_DDL_AUTO:none}
spring.jpa.show-sql=${APP_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=${APP_DB_INIT_MODE:never}
spring.sql.init.continue-on-error=false

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Cloudflare R2
app.r2.s3-api-url=${APP_R2_S3_API_URL:}
app.r2.endpoint=${APP_R2_ENDPOINT:}
app.r2.bucket=${APP_R2_BUCKET:}
app.r2.public-base-url=${APP_R2_PUBLIC_BASE_URL:}
app.r2.access-key-id=${APP_R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${APP_R2_SECRET_ACCESS_KEY:}
app.r2.upload-enabled=${APP_R2_UPLOAD_ENABLED:true}

# Error handling
server.error.include-message=always

# Mistral AI Chatbot
app.mistral.api-key=${APP_MISTRAL_API_KEY:}
app.mistral.api-url=https://api.mistral.ai/v1/chat/completions
app.mistral.model=${APP_MISTRAL_MODEL:mistral-large-latest}
app.chat.system-prompt-file=${APP_CHAT_SYSTEM_PROMPT_FILE:system_prompt.txt}
app.chat.context-file=${APP_CHAT_CONTEXT_FILE:context.json}
app.chat.conversations-file=${APP_CHAT_CONVERSATIONS_FILE:conversations.json}

# MongoDB
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=chatdb

# Firebase
firebase.api-key=${FIREBASE_WEB_API_KEY}

# Spring Mail (SMTP)
spring.mail.host=${APP_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${APP_MAIL_PORT:587}
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
app.mail.from=${APP_MAIL_FROM:noreply@antojitos.maps}
app.mail.enabled=${APP_MAIL_ENABLED:false}

# Testmail.app (inbox de auditoría)
app.testmail.namespace=${APP_TESTMAIL_NAMESPACE:}
app.testmail.tag=${APP_TESTMAIL_TAG:complaints}
app.testmail.apikey=${APP_TESTMAIL_APIKEY:}
